<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala VIP - Chat & Automação de Áudio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --bubble-user: #2563eb;
            --bubble-system: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background-color: #111827;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background-color: #1e293b;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .control-group {
            flex: 1;
            min-width: 150px;
        }

        .control-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background-color: var(--bubble-user);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.system {
            background-color: var(--bubble-system);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            width: 100%;
            box-sizing: border-box;
        }

        .message-text {
            font-size: 0.95rem;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .message audio {
            width: 100%;
            height: 35px;
            margin-top: 5px;
        }

        .chat-input-area {
            padding: 20px;
            background-color: #111827;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        input[type="text"].message-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            padding: 0 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>🎙️ Sala VIP - Bate-Papo & Automação Neural</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Dicionário Ativo (108 Expressões)</span>
        </div>

        <div class="controls-bar">
            <div class="control-group">
                <label for="vozSelect">Voz Ativa:</label>
                <select id="vozSelect">
                    <option value="francisca">Francisca (Feminina / Alegre)</option>
                    <option value="thalita">Camila (Feminina / Suave)</option>
                    <option value="antonio">Antonio (Masculino / Profissional)</option>
                    <option value="humberto">Humberto (Masculino / Forte)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="rateSelect">Velocidade:</label>
                <select id="rateSelect">
                    <option value="-10%">Lenta (-10%)</option>
                    <option value="+0%" selected>Normal (100%)</option>
                    <option value="+10%">Rápida (+10%)</option>
                    <option value="+20%">Muito Rápida (+20%)</option>
                </select>
            </div>
        </div>

        <div id="chatMessages" class="chat-messages">
            <div class="message system">
                <div class="message-text">👋 Bem-vindo à Sala VIP! Digite qualquer frase abaixo (com gírias regionais como "égua", "oxe", "trampo", etc.) para gerar a locução neural instantaneamente.</div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" class="message-input" placeholder="Digite sua mensagem ou comando de áudio..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
            <button onclick="enviarMensagem()">Enviar & Gerar Áudio</button>
        </div>
    </div>

    <script>
        async function enviarMensagem() {
            const input = document.getElementById("userInput");
            const texto = input.value.trim();
            const voz = document.getElementById("vozSelect").value;
            const rate = document.getElementById("rateSelect").value;

            if (!texto) return;

            const chatMessages = document.getElementById("chatMessages");

            // Adiciona a mensagem do utilizador no chat
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user";
            userMsgDiv.innerHTML = `<div class="message-text">${texto}</div>`;
            chatMessages.appendChild(userMsgDiv);

            input.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Cria mensagem de carregamento do sistema
            const sysMsgDiv = document.createElement("div");
            sysMsgDiv.className = "message system";
            sysMsgDiv.innerHTML = `<div class="message-text">⏳ Processando dicionário e sintetizando voz (${voz})...</div>`;
            chatMessages.appendChild(sysMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const projetoNome = "chat_" + Date.now();
                const response = await fetch("/api/gerar-audio", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        texto: texto,
                        projeto: projetoNome,
                        voz: voz,
                        rate: rate
                    })
                });

                const data = await response.json();

                if (data.sucesso) {
                    sysMsgDiv.innerHTML = `
                        <div class="message-text">✅ Áudio gerado com sucesso!</div>
                        <audio controls src="${data.arquivo_url}?t=${Date.now()}"></audio>
                    `;
                } else {
                    sysMsgDiv.innerHTML = `<div class="message-text" style="color: #ef4444;">❌ Erro: ${data.erro}</div>`;
                }
            } catch (err) {
                sysMsgDiv.innerHTML = `<div class="message-text" style="color: #ef4444;">❌ Erro de conexão com o servidor.</div>`;
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>

</body>
</html>
